  title: "Ruch dla ciała. Spokój dla głowy. Czas dla każdego."
  description: "Ruch dla ciała, spokój dla głowy, czas dla każdego. Równoległe zajęcia dla dzieci i rodziców — zaprojektowane tak, by każdy dostał to, czego potrzebuje."

